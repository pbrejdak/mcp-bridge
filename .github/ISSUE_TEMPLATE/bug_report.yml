name: Bug report
description: A defect in MCP Bridge — daemon, Bridge Console, mobile SDK, or docs.
title: "bug: <short summary>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before submitting:

        - **Security vulnerabilities:** stop and follow [docs/SECURITY.md](../blob/main/docs/SECURITY.md) instead — do **not** report them here.
        - **One bug per report.** If you've found two, file two.
        - Per [docs/CONTRIBUTING.md §3.1](../blob/main/docs/CONTRIBUTING.md), include reproduction steps, expected vs actual, OS/version, and Bridge version.

  - type: input
    id: version
    attributes:
      label: Bridge version
      description: Output of `mcp-bridge --version`. If not yet installable, say "from source @ <commit>".
      placeholder: "0.1.0 (or: from source @ a04b1a5)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system + version
      placeholder: "macOS 15.2, Windows 11 23H2, Ubuntu 24.04, …"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: A minimal sequence that reproduces the bug. Numbered list is best.
      placeholder: |
        1. ...
        2. ...
        3. Expected: ...
           Actual: ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic bundle (optional but appreciated)
      description: |
        Settings → Privacy → Copy diagnostics. **Review the bundle before pasting** — redaction is best-effort, not perfect.
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Pre-flight
      options:
        - label: I am not reporting a security vulnerability (those go through docs/SECURITY.md).
          required: true
        - label: I searched existing issues and discussions and didn't find a duplicate.
          required: true
