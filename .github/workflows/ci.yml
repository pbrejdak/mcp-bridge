# CI for MCP Bridge.
#
# Matches the required checks listed in docs/CONTRIBUTING.md §10:
#   - cargo fmt --all -- --check
#   - cargo clippy --all-targets -- -D warnings
#   - cargo test --workspace
#   - cargo deny check
#   - svelte-check + vite build for the Bridge Console renderer
#
# DCO sign-off enforcement is done by the DCO GitHub App
# (https://probot.github.io/apps/dco/), not by this workflow — installation
# happens once at the org level.
#
# SLSA provenance is built by the release workflow, not here.
#
# Platform matrix: clippy + test now run on Linux, macOS, and Windows
# because keystore (keyring), proxy::listener, IPC (UDS vs named-pipe),
# and the install module all have per-OS code paths. fmt + deny +
# spec-fixtures stay Linux-only (deterministic regardless of host).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux WebKit deps (bridge-console)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-OS cache key so the same lockfile produces independent
          # caches on each runner (different binary layouts).
          shared-key: "clippy-${{ matrix.os }}"
      - run: cargo clippy --all-targets --workspace -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux WebKit deps (bridge-console)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.os }}"
      - run: cargo test --workspace --all-targets

  console:
    name: bridge-console (svelte-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bridge-console/package-lock.json
      - working-directory: bridge-console
        run: npm ci
      - working-directory: bridge-console
        run: npm run check
      - working-directory: bridge-console
        run: npm run build

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  spec-fixtures:
    name: spec fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SAS wordlist line count
        run: |
          lines=$(wc -l < test-vectors/sas-wordlist-v1.txt)
          if [ "$lines" -ne 2048 ]; then
            echo "::error::sas-wordlist-v1.txt must have exactly 2048 lines, has $lines"
            exit 1
          fi
      - name: SAS wordlist SHA-256
        run: |
          expected="2f5eed53a4727b4bf8880d8f3f199efc90e58503646d9ff8eff3a2ed3b24dbda"
          actual=$(sha256sum test-vectors/sas-wordlist-v1.txt | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::sas-wordlist-v1.txt SHA-256 drift — expected $expected, got $actual"
            exit 1
          fi
