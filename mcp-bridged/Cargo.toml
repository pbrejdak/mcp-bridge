[package]
name = "mcp-bridged"
version = "0.1.0"
description = "MCP Bridge — Stable-Loopback Bridge daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Single binary, multiple modes (docs/DAEMON.md §10). Binary name differs from
# package name: package is `mcp-bridged`, CLI invocation is `mcp-bridge`.
[[bin]]
name = "mcp-bridge"
path = "src/main.rs"

[lib]
name = "mcp_bridged"
path = "src/lib.rs"

# Phase 1 scaffold deps only. The full frozen-for-v1 dep set lives in
# docs/DAEMON.md §12 and lands module-by-module as subsystems are implemented.
[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-segmentation = "1"
url = { version = "2", features = ["serde"] }
