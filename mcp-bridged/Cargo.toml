[package]
name = "mcp-bridged"
version = "0.1.0"
description = "MCP Bridge — Stable-Loopback Bridge daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Single binary, multiple modes (docs/DAEMON.md §10). Binary name differs from
# package name: package is `mcp-bridged`, CLI invocation is `mcp-bridge`.
[[bin]]
name = "mcp-bridge"
path = "src/main.rs"

[lib]
name = "mcp_bridged"
path = "src/lib.rs"

# Phase 1 scaffold deps only. The full frozen-for-v1 dep set lives in
# docs/DAEMON.md §12 and lands module-by-module as subsystems are implemented.
[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
constant_time_eq = "0.3"
crypto_box = "0.9"
directories = "5"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
futures-core = "0.3"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-async-persistent", "async-secret-service", "crypto-rust"] }
mdns-sd = { version = "0.20", default-features = false, features = ["async"] }
qrcode = { version = "0.14", default-features = false }
rcgen = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "net"] }
tokio-stream = "0.1"
